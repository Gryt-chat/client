name: Resolve package metadata

on:
  push:
    branches:
      - chore/bump-ui-0.34.3-voice-0.5.6

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Print published Gryt UI metadata
        run: npm view @gryt/ui@0.34.3 dist --json
