name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Only the web bundle is linted and built here, and the Electron binary is a
      # ~100MB download nothing in this job runs. Packaging is release.yml's job.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:updater-bridge
      - run: yarn test:server-notice
      - run: yarn test:identity-vault
      - run: yarn test:identity-certificate
      - run: yarn test:message-vault
      - run: yarn test:message-key
      - run: yarn test:message-key-offer
      - run: yarn test:reset-warning
      - run: yarn test:guest-history
      - run: yarn test:sidebar-tree
      - run: yarn test:settings-index
      - run: yarn test:notification-prefs
      - run: yarn test:hotkeys
      - run: yarn test:screen-audio
      - run: yarn test:audio-mixer
      - run: yarn test:capture-set
      - run: yarn test:avatar-precedence
      - run: yarn test:mention-tracker
      - run: yarn test:unread-tracker
      - run: yarn test:peer-keys
      - run: yarn test:dm-key-published
      - run: yarn test:sealed-text
      - run: yarn test:sealed-send
      - run: yarn test:sealed-fallback
      - run: yarn test:sealed-attachments
      - run: yarn test:member-key-wording
      - run: yarn test:owl-export
      - run: yarn test:owl-seen
      - run: yarn test:windows-signature
      - run: yarn test:builder-config
      - run: yarn test:server-order
      - run: yarn test:tile-contrast
      - run: yarn test:card-byline
      - run: yarn test:member-invite
      - run: yarn test:addon-capabilities
      - run: yarn test:actor-name
      - run: yarn test:plugin-messaging
      - run: yarn test:plugin-wording
      - run: yarn test:plugin-isolation
      - run: yarn test:plugin-panel
      # The claim is that only the programs somebody listed leave the main
      # process. Nothing else here would notice that stopping being true.
      - run: yarn test:watched-programs
      # Sign-in leaves for the browser and comes back through gryt://. If the
      # AppImage moved, it cannot — and nothing else here would notice.
      - run: yarn test:appimage-location
      # A session somebody ended has to stay ended, and recovering from one has to give up.
      # Both are decided in one small module, and neither is visible from anywhere else.
      - run: yarn test:session-recovery
      # Who may be acted on, and the typing gate on the ban dialog. Both are
      # enforced again by the server, and neither is visible from anywhere else.
      - run: yarn test:member-moderation
      # A device somebody signed out has to stay signed out across a restart,
      # and the note that makes that happen is not visible from anywhere else.
      - run: yarn test:signed-out
      # Confirmations drift when each one is hand-rolled: Cancel drawn as the
      # primary action, destructive confirms untoned, widths wherever.
      - run: yarn test:dialog-primitives
      # Which native prebuild survives packaging. Pruning too eagerly leaves an
      # app that starts and dies on the first global hotkey.
      - run: yarn test:prebuild-pruning
      # The outage banner has to stay silent when nothing is wrong, and a
      # client with no internet must not invent an outage.
      - run: yarn test:service-status
      # examples/ is the addon people copy. It calls the same `gryt` API the
      # worker exposes, and nothing else here would notice it drifting.
      - run: yarn test:examples
      - run: yarn test:fake-participants
      - run: yarn test:narrow-layout
      - run: yarn test:permission-grid
      - run: yarn test:call-controls
      - run: yarn test:embedded-server-paths
      - run: yarn test:embedded-version
      - run: yarn test:voice-state
      - run: yarn test:media-state
      - run: yarn test:calls
      - run: yarn test:call-members
      - run: yarn test:alone-in-call
      - run: yarn test:fake-server-events
      - run: yarn test:channel-permissions
      - run: yarn test:report-user

      # No comment runs past two lines. The script carries the list of paths
      # still to be swept, and that list only ever shrinks.
      - run: yarn test:comment-length
      - run: yarn test:window-buttons
      - run: yarn test:scan-consent
      # tsc -b and eslint with --max-warnings 0. client#115 merged with three
      # TS6133 errors and main did not compile until the next PR.
      - run: yarn lint
      # lint already runs tsc, so this is really vite build — it catches an import
      # that resolves for TypeScript and not for the bundler.
      - run: yarn build

  # The capture helpers are C++ and only compile on Windows, so a mistake in them
  # used to surface during a release. This proves they build, and runs nothing.
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the native capture helpers
        shell: cmd
        run: native\build.bat
      - name: Check both binaries landed
        shell: pwsh
        run: |
          foreach ($exe in "audio-capture.exe", "screen-capture.exe") {
            $path = "build/native/$exe"
            if (-not (Test-Path $path)) { throw "missing $path" }
            Write-Host "$exe $((Get-Item $path).Length) bytes"
          }
