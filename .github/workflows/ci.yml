name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Only the web bundle is linted and built here, and the Electron binary is
      # a ~100MB download that nothing in this job runs. Skipping it also keeps a
      # flaky download from failing a job that has nothing to do with it.
      # Packaging the desktop app is release.yml's problem, not this one.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:updater-bridge
      - run: yarn test:identity-vault
      - run: yarn test:hotkeys
      - run: yarn test:screen-audio
      - run: yarn test:audio-mixer
      - run: yarn test:capture-set
      - run: yarn test:avatar-precedence
      - run: yarn test:peer-keys
      - run: yarn test:dm-key-published
      - run: yarn test:sealed-text
      - run: yarn test:sealed-send
      - run: yarn test:sealed-attachments
      - run: yarn test:member-key-wording
      - run: yarn test:owl-export
      - run: yarn test:owl-seen
      - run: yarn test:server-order
      - run: yarn test:tile-contrast
      - run: yarn test:fake-participants
      - run: yarn test:narrow-layout
      - run: yarn test:permission-grid
      - run: yarn test:call-controls
      - run: yarn test:embedded-server-paths
      - run: yarn test:embedded-version
      - run: yarn test:voice-state
      - run: yarn test:media-state
      - run: yarn test:calls
      - run: yarn test:call-members
      - run: yarn test:alone-in-call
      - run: yarn test:fake-server-events
      # tsc -b and eslint with --max-warnings 0. This is the check that was
      # missing: client#115 merged with three TS6133 errors and main did not
      # compile until the next PR happened to supply the code that used them.
      - run: yarn lint
      # lint already runs tsc, so this is really vite build — it catches what
      # type-checking cannot, like an import that resolves for TypeScript and
      # not for the bundler.
      - run: yarn build

  # The capture helpers are C++ and only compile on Windows, so until now a
  # mistake in them surfaced during a release rather than on the PR that made
  # it. This does not run them — process loopback needs real audio devices —
  # it only proves they still build.
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the native capture helpers
        shell: cmd
        run: native\build.bat
      - name: Check both binaries landed
        shell: pwsh
        run: |
          foreach ($exe in "audio-capture.exe", "screen-capture.exe") {
            $path = "build/native/$exe"
            if (-not (Test-Path $path)) { throw "missing $path" }
            Write-Host "$exe $((Get-Item $path).Length) bytes"
          }
