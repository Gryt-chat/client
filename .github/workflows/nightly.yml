name: Nightly

# Voice, screen share and the desktop app, which the PR suite can't reach. The nightly
# section of e2e/README.md has the server, the secrets and how to run it by hand.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      releases:
        description: "Which server, SFU and image worker the desktop app embeds"
        type: choice
        default: stable
        options: [stable, beta]
  # A change to the suite, or to what the desktop-hosting test walks through, runs it before it merges.
  pull_request:
    paths:
      - e2e/nightly/**
      - .github/workflows/nightly.yml
      - electron/**
      - scripts/build-embedded-server.ts
      - src/packages/settings/src/components/addServer.tsx

permissions:
  contents: read

jobs:
  # A call on test.gryt.chat, through the tunnel and the SFU's public address.
  call:
    # A fork gets no secrets, and without them there's no server to call.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One run at a time on the shared server. A queued run waits instead of cancelling this one.
    concurrency:
      group: nightly-test-server
      cancel-in-progress: false
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: yarn playwright install chromium --only-shell
      - run: yarn vite build
      - run: yarn playwright test --config e2e/nightly/playwright.config.ts --project call
        env:
          GRYT_TEST_SERVER_URL: ${{ secrets.GRYT_TEST_SERVER_URL }}
          GRYT_TEST_INVITE_CODE: ${{ secrets.GRYT_TEST_INVITE_CODE }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-call-report
          path: |
            e2e/nightly/playwright-report
            e2e/nightly/test-results
          retention-days: 14

  # The Electron app from this commit, hosting a server built from the newest releases.
  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      # Release Client embeds the newest release of each, and build-embedded-server.mjs finds them beside the client.
      - name: Check out the newest server, SFU and image worker releases
        env:
          # Stable tags only, unless a hand-started run asks for the betas too.
          TAGS: ${{ inputs.releases == 'beta' && 'v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?' || 'v[0-9]+\.[0-9]+\.[0-9]+' }}
        run: |
          for repo in server sfu image-worker; do
            url="https://github.com/Gryt-chat/$repo.git"
            tag=$(git ls-remote --tags --refs "$url" 'v*' | sed 's#.*refs/tags/##' | grep -Ex "$TAGS" | sort -V | tail -1)
            git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" "$url" "$repo"
            echo "$repo $tag"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: |
            client/yarn.lock
            server/yarn.lock
            image-worker/yarn.lock
      - uses: actions/setup-go@v5
        with:
          go-version-file: sfu/go.mod
          cache-dependency-path: sfu/go.sum
      - run: yarn install --frozen-lockfile
        working-directory: client
      - run: yarn install --frozen-lockfile --ignore-engines
        working-directory: server
      - run: yarn install --frozen-lockfile --ignore-engines
        working-directory: image-worker
      - run: yarn build:embedded-server
        working-directory: client
      - run: yarn vite build
        working-directory: client
        env:
          ELECTRON: "1"
      - id: playwright
        working-directory: client
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: client
        run: yarn playwright install chromium --only-shell
      - name: Make sure xvfb and lsof are there
        run: command -v xvfb-run lsof || (sudo apt-get update && sudo apt-get install -y xvfb lsof)
      - run: xvfb-run --auto-servernum yarn playwright test --config e2e/nightly/playwright.config.ts --project electron
        working-directory: client
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-electron-report
          path: |
            client/e2e/nightly/playwright-report
            client/e2e/nightly/test-results
          retention-days: 14

  # A red nightly keeps one open task until a run passes, so it can't sit failing unnoticed.
  track:
    needs: [call, electron]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Open, add to or close the "Nightly is red" task
        env:
          TOKEN: ${{ secrets.VIKUNJA_API_TOKEN }}
          API: https://tasks.sivert.io/api/v1
          PROJECT: "2"
          CALL: ${{ needs.call.result }}
          ELECTRON: ${{ needs.electron.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "::warning::No VIKUNJA_API_TOKEN, so no task."; exit 0; fi
          api() { curl -sS --fail-with-body --max-time 30 -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" "$@"; }
          title="Nightly is red"
          failed=""
          for job in "call:$CALL" "electron:$ELECTRON"; do [ "${job#*:}" = failure ] && failed="$failed ${job%%:*}"; done
          open=$(api "$API/tasks?s=$(jq -rn --arg t "$title" '$t|@uri')&filter=done%20%3D%20false" \
            | jq -r --arg t "$title" --argjson p "$PROJECT" '[.[] | select(.title == $t and .project_id == $p)][0].id // empty')
          if [ -n "$failed" ]; then
            if [ -n "$open" ]; then
              api -X PUT "$API/tasks/$open/comments" -d "$(jq -n --arg c "Still red:$failed. $RUN_URL" '{comment: $c}')" >/dev/null
            else
              body="<p>The nightly failed:$failed. This task stays open until a nightly passes, and each red night adds a comment.</p><p>$RUN_URL</p>"
              api -X PUT "$API/projects/$PROJECT/tasks" -d "$(jq -n --arg t "$title" --arg d "$body" '{title: $t, description: $d, priority: 4}')" >/dev/null
            fi
          elif [ -n "$open" ] && [ "$CALL" = success ] && [ "$ELECTRON" = success ]; then
            api -X PUT "$API/tasks/$open/comments" -d "$(jq -n --arg c "Green again. $RUN_URL" '{comment: $c}')" >/dev/null
            # The REST update replaces the whole task, so send all of it back with done set.
            api "$API/tasks/$open" | jq '.done = true' | api -X POST "$API/tasks/$open" -d @- >/dev/null
          fi
