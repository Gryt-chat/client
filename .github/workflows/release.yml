name: Release Client

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release Channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      bump:
        description: "Version Bump Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version, if "custom" is selected'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: client
  DOCKER_IMAGE: ghcr.io/gryt-chat/client

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
      release_type: ${{ steps.release_type.outputs.release_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Git user
        shell: bash
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ github.event.inputs.channel }}"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "custom_version is required when bump=custom"
              exit 1
            fi

            if ! [[ "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid custom version: $CUSTOM_VERSION"
              echo "Expected semver like 1.2.3 or 1.2.3-beta.1"
              exit 1
            fi

            npm version "$CUSTOM_VERSION" --no-git-tag-version
          else
            npm version "$BUMP" --no-git-tag-version
          fi

          NEW_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Version did not change: $CURRENT_VERSION"
            exit 1
          fi

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists on origin."
            exit 1
          fi

          git add package.json package-lock.json yarn.lock 2>/dev/null || git add package.json
          git commit -m "release: v$NEW_VERSION (${{ steps.channel.outputs.channel }})"
          git tag "v$NEW_VERSION"
          git push origin HEAD
          git push origin "v$NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.bump.outputs.new_version }}"

          if [[ -z "$VERSION" ]]; then
            echo "Could not determine release version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine checkout ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          echo "checkout_ref=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.channel.outputs.channel }}" == "latest" ]]; then
            echo "release_type=release" >> "$GITHUB_OUTPUT"
          else
            echo "release_type=prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gryt Client v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          body: |
            Gryt Client v${{ steps.version.outputs.version }}

            Channel: ${{ steps.channel.outputs.channel }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-electron:
    name: Build Electron app (${{ matrix.os }})
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    env:
      OWNER: Gryt-chat
      REPO: client
      VERSION: ${{ needs.prepare-release.outputs.version }}
      CHANNEL: ${{ needs.prepare-release.outputs.channel }}
      RELEASE_TYPE: ${{ needs.prepare-release.outputs.release_type }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        shell: bash
        run: |
          yarn install --frozen-lockfile --ignore-engines

      - name: Type-check and lint
        shell: bash
        run: |
          npx tsc -b
          npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0 || true

      - name: Build native audio Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash native/audio-capture/build.sh

      - name: Build native audio macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash native/audio-capture/build.sh

      - name: Set up MSVC Build Tools Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native Windows binaries
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          native\build.bat

      - name: Build Electron app
        shell: bash
        env:
          ELECTRON: "1"
        run: |
          npx vite build

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: runner.os == 'Linux'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ env.VERSION }}"
          CHANNEL="${{ env.CHANNEL }}"
          IMAGE="${{ env.DOCKER_IMAGE }}"

          V_MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          V_MINOR="$(echo "$VERSION" | cut -d. -f2)"

          TAGS=(
            "${IMAGE}:${VERSION}"
            "${IMAGE}:${V_MAJOR}.${V_MINOR}"
            "${IMAGE}:${V_MAJOR}"
            "${IMAGE}:latest-beta"
          )

          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=("${IMAGE}:latest")
          fi

          ARGS=()
          for TAG in "${TAGS[@]}"; do
            ARGS+=(-t "$TAG")
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=${IMAGE}:buildcache \
            --cache-to type=registry,ref=${IMAGE}:buildcache,mode=max \
            "${ARGS[@]}" \
            --push .

      - name: Install Snapcraft
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic

      - name: Package and publish Electron app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
          CHANNEL: ${{ env.CHANNEL }}
          RELEASE_TYPE: ${{ env.RELEASE_TYPE }}
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            TARGETS="--linux AppImage deb snap"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            TARGETS="--mac"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            TARGETS="--win"
          else
            echo "Unsupported runner OS: $RUNNER_OS"
            exit 1
          fi

          npx electron-builder \
            $TARGETS \
            --publish always \
            -c.publish.provider=github \
            -c.publish.owner="$OWNER" \
            -c.publish.repo="$REPO" \
            -c.publish.releaseType="$RELEASE_TYPE"

      - name: Notify Discord
        if: runner.os == 'Linux'
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          VERSION: ${{ env.VERSION }}
          CHANNEL: ${{ env.CHANNEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL secret not set, skipping"
            exit 0
          fi

          TAG="v$VERSION"
          RELEASE_URL="https://github.com/${{ env.RELEASE_OWNER }}/${{ env.RELEASE_REPO }}/releases/tag/$TAG"

          if [[ "$CHANNEL" == "beta" ]]; then
            DISP_CHANNEL="Beta"
            COLOR=16750848
          else
            DISP_CHANNEL="Stable"
            COLOR=5763719
          fi

          RELEASE_BODY="$(gh release view "$TAG" --repo "${{ env.RELEASE_OWNER }}/${{ env.RELEASE_REPO }}" --json body -q '.body' || true)"
          BODY="$(printf '%s' "$RELEASE_BODY" | head -c 1800)"

          PAYLOAD="$(jq -n \
            --arg title "Gryt Client $TAG" \
            --arg url "$RELEASE_URL" \
            --arg desc "$BODY" \
            --arg channel "$DISP_CHANNEL" \
            --arg component "Client" \
            --arg tag "$TAG" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: $color,
                fields: [
                  { name: "Component", value: $component, inline: true },
                  { name: "Channel", value: $channel, inline: true },
                  { name: "Version", value: $tag, inline: true }
                ],
                footer: { text: "Gryt Releases" },
                timestamp: (now | todate)
              }]
            }'
          )"

          curl -sfS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
