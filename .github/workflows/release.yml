name: Release Client

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release Channel'
        required: true
        default: 'beta'
        type: choice
        options: ['beta', 'latest']
      bump:
        description: 'Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options: ['patch', 'minor', 'major', 'custom']
      custom_version:
        description: 'Custom Version (if "custom" selected above, else leave blank)'
        required: false
        default: ''
        type: string

  push:
    tags:
      - 'v*.*.*'

jobs:
  # Build and publish Electron app for all OS
  build-electron:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OWNER: Gryt-chat
      REPO: gryt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Type-check and lint
        run: |
          npx tsc -b
          npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0 || true

      - name: Build native audio
        run: bash native/audio-capture/build.sh || echo "Native audio build skipped"

      - name: Build Electron app
        env:
          ELECTRON: '1'
        run: npx vite build

      - name: Set up Git user for version bump (only on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # Version bump only on Linux, then let other runners use the version (avoids duplicate bumps/tags)
      - name: Bump version
        id: version
        if: matrix.os == 'ubuntu-latest'
        uses: phips28/gh-action-bump-version@v11.0.2
        with:
          version-type: ${{ github.event.inputs.bump == 'custom' && '' || github.event.inputs.bump }}
          custom-tag: ${{ github.event.inputs.bump == 'custom' && github.event.inputs.custom_version || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine channel
        id: channel
        run: |
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            CHANNEL="latest"
          else
            CHANNEL="beta"
          fi
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

      # Docker only on Linux
      - name: Set up Docker Buildx
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: matrix.os == 'ubuntu-latest'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: matrix.os == 'ubuntu-latest'
        env:
          IMAGE: ghcr.io/gryt-chat/client
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"
          V_MAJOR=$(echo "$VERSION" | cut -d. -f1)
          V_MINOR=$(echo "$VERSION" | cut -d. -f2)

          TAGS=(
            "${IMAGE}:$VERSION"
            "${IMAGE}:$V_MAJOR.$V_MINOR"
            "${IMAGE}:$V_MAJOR"
            "${IMAGE}:latest-beta"
          )
          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=("${IMAGE}:latest")
          fi
          ARGS=( )
          for TAG in "${TAGS[@]}"; do
            ARGS+=( -t "$TAG" )
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=${IMAGE}:buildcache \
            --cache-to type=registry,ref=${IMAGE}:buildcache,mode=max \
            "${ARGS[@]}" \
            --push .

      # Only do the release tagging/creation on Linux, once
      - name: Tag and create GitHub Release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Package & publish Electron (all platforms)
      - name: Package and Publish Electron App (multiplatform)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          RELEASE_TYPE="prerelease"
          if [ "$CHANNEL" = "latest" ]; then
            RELEASE_TYPE="release"
          fi
          npx electron-builder \
            --${{ matrix.os == 'ubuntu-latest' && 'linux' || (matrix.os == 'macos-latest' && 'mac' || 'win') }} \
            --publish always \
            -c.publish.provider=github \
            -c.publish.owner="$OWNER" \
            -c.publish.repo="$REPO" \
            -c.publish.releaseType="$RELEASE_TYPE"

      # Only notify Discord on Linux (single notification per release)
      - name: Notify Discord
        if: matrix.os == 'ubuntu-latest'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          VERSION: ${{ steps.get_version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL secret not set — skipping"
            exit 0
          fi

          REPO_NAME="client"
          TAG="v$VERSION"
          RELEASE_URL="https://github.com/Gryt-chat/gryt/releases/tag/$TAG"
          PRERELEASE="false"
          if [ "$CHANNEL" == "beta" ]; then
            PRERELEASE="true"
          fi

          COMPONENT="Client"
          if [ "$PRERELEASE" = "true" ]; then
            DISP_CHANNEL="Beta"
            COLOR=16750848
          else
            DISP_CHANNEL="Stable"
            COLOR=5763719
          fi

          RELEASE_BODY="$(gh release view $TAG --repo Gryt-chat/gryt --json body -q '.body')"
          BODY=$(printf '%s' "$RELEASE_BODY" | head -c 1800)

          PAYLOAD=$(jq -n \
            --arg title "Gryt $COMPONENT $TAG" \
            --arg url "$RELEASE_URL" \
            --arg desc "$BODY" \
            --arg channel "$DISP_CHANNEL" \
            --arg component "$COMPONENT" \
            --arg tag "$TAG" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: $color, fields: [ { name: "Component", value: $component, inline: true }, { name: "Channel", value: $channel, inline: true }, { name: "Version", value: $tag, inline: true } ], footer: { text: "Gryt Releases" }, timestamp: (now | todate) }]}')

          curl -sfS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL"
