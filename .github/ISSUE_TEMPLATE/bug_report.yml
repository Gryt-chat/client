name: Bug report
description: Something in Gryt does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Gryt is mostly one person's work, so a report
        with enough detail to reproduce is worth a great deal more than a fast one.

        If you would rather not use GitHub, [feedback.gryt.chat](https://feedback.gryt.chat)
        goes to the same place.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
      placeholder: I clicked join on an invite and the channel list stayed empty.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How do you make it happen again?
      description: >
        Even a rough sequence helps. If it only happened once and you cannot
        reproduce it, say so — that is useful in itself.
      placeholder: |
        1. Open Gryt
        2. Paste an invite into Add a server
        3. Connect
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of Gryt?
      description: >
        A guess is fine. Voice and screen share live in a different repository to
        the app, so this mostly decides where the issue gets moved to.
      options:
        - Not sure
        - Voice or screen share
        - Chat and messages
        - Servers, invites and joining
        - Settings
        - Updates and installing
        - Something else
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Gryt version
      description: Filled in for you when you report from inside the app.
      placeholder: 1.4.1
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Filled in for you when you report from inside the app.
      placeholder: macOS, desktop app
    validations:
      required: false
