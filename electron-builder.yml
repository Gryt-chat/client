appId: com.gryt.chat
productName: Gryt Chat
executableName: gryt-chat
copyright: "Copyright © 2024-2026 Gryt Chat. All rights reserved."
artifactName: "Gryt-Chat-${version}-${os}-${arch}.${ext}"

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - electron/splash.html

extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/native/
    to: native/
    filter:
      - "**/*"
  - from: build/embedded-server/server/
    to: embedded-server/server/
    filter:
      - "**/*"
  - from: build/embedded-server/server/node_modules/
    to: embedded-server/server/node_modules/
    filter:
      - "**/*"
  - from: build/embedded-server/sfu/${os}-${arch}/
    to: embedded-server/sfu/
    filter:
      - "**/*"
  # The worker is listed twice for the same reason the server is: electron
  # builder does not descend into node_modules under a `from` directory, so the
  # second entry is what actually carries sharp and its platform binary. With
  # only the first, the worker ships with no dependencies and dies on require.
  - from: build/embedded-server/worker/
    to: embedded-server/worker/
    filter:
      - "**/*"
  - from: build/embedded-server/worker/node_modules/
    to: embedded-server/worker/node_modules/
    filter:
      - "**/*"

# Releases are published to the gryt superproject, not to this repository —
# release-client.yml lives there and builds the client from a pinned submodule
# commit. This value is baked into app-update.yml, so pointing it at `client`
# leaves the shipped app polling a repository with no releases.
publish:
  provider: github
  owner: Gryt-chat
  repo: gryt
  releaseType: release

afterSign: scripts/notarize.cjs

protocols:
  - name: Gryt
    schemes:
      - gryt

linux:
  target:
    - AppImage
    - deb
    - snap
  category: Network
  synopsis: "Real-time voice chat"
  description: "Gryt Chat — real-time voice chat desktop client"
  mimeTypes:
    - x-scheme-handler/gryt
  desktop:
    entry:
      X-AppImage-Payload-License: "AGPL-3.0-or-later"

snap:
  confinement: strict
  grade: stable
  summary: "Real-time voice chat"
  plugs:
    - default
    - audio-record
    - camera
    - screen-inhibit-control
    - avahi-observe
    - network-bind

mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.social-networking
  extendInfo:
    NSMicrophoneUsageDescription: "Gryt Chat uses your microphone for voice chat."
    NSCameraUsageDescription: "Gryt Chat uses your camera for video chat."
    NSAudioCaptureUsageDescription: "Gryt Chat can capture audio when you choose to share your screen."
    NSScreenCaptureUsageDescription: "Gryt Chat lets you share your screen."

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  legalTrademarks: "Gryt Chat is a trademark of Gryt Chat"
  requestedExecutionLevel: asInvoker

portable:
  artifactName: "Gryt-Chat-${version}-${os}-${arch}-portable.${ext}"

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  displayLanguageSelector: false
  uninstallDisplayName: "Gryt Chat"
  shortcutName: "Gryt Chat"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
