<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gryt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* One accent drives the bar, the logo glow and the beta tag. Swapped
         wholesale on a beta build — see the -beta check in the script. */
      --accent: #968ff8;
      --accent-soft: #b4afff;
      /* The owl's body and face are their own values rather than the accent,
         because the accent is also the bar and the glow, and the mark's violet
         is not the bar's violet. Both follow the same beta swap — the face is
         a shade above the body in the mark, and tinting one without the other
         gives a beta build an amber bird with a violet face. */
      --owl-body: #a495e3;
      --owl-face: #b5a8e6;
      --owl-wing: #7c6ec3;
      --bg: #111318;
      --text: #e0e0e6;
      --muted: #888;
      --faint: #555;
      --track: #1e2028;
      --error: #f87171;
    }

    body.beta {
      --accent: #f2a33c;
      --accent-soft: #ffc46b;
      --owl-body: #f2a33c;
      --owl-face: #ffc46b;
      --owl-wing: #b77834;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      -webkit-app-region: drag;
      user-select: none;
      overflow: hidden;
    }

    /* Left-aligned, with the progress bar flush on the window's bottom edge. */
    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px 28px 0;
    }

    .top { display: flex; align-items: center; gap: 12px; }

    .top svg { filter: drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 34%, transparent)); }

    .brand {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    /* The official beta wordmark treatment, matched in the app's own Wordmark
       component so the two never drift. */
    .beta-tag {
      display: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #12111a;
      background: var(--accent);
      padding: 2px 5px;
      border-radius: 4px;
    }
    body.beta .beta-tag { display: inline-block; }

    .mid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 26px;
    }

    /* The reserved height fits the version pair below, not the sentence, so
       the block does not shift when a check turns into a download. */
    .head {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      min-height: 26px;
      display: flex;
      align-items: baseline;
      gap: 9px;
    }
    .head.error { color: var(--error); }

    /* What you are upgrading to is the reason this window is open, so it is
       the headline and the sentence that used to be here moves down a line.
       Only the states that have a version to point at get this treatment. */
    .head.versions {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 21px;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    /* A beta pair is around 29 characters — "1.4.1-beta.12 → 1.5.0-beta.1" —
       which runs past 420px at the size above. */
    .head.versions.long { font-size: 15px; }

    .head .from {
      color: var(--faint);
      font-size: 0.8em;
      font-weight: 400;
    }
    .head .arrow { color: var(--muted); font-weight: 400; }
    .head .to { color: var(--accent-soft); }

    .sub { font-size: 12px; color: var(--muted); min-height: 18px; }
    .foot { font-size: 12px; color: var(--faint); min-height: 18px; }

    .track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--track);
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      transition: width 0.25s ease;
    }

    .bar.indeterminate {
      width: 38%;
      transition: none;
      animation: sweep 1.35s ease-in-out infinite;
    }

    @keyframes sweep {
      0%   { transform: translateX(-105%); }
      100% { transform: translateX(300%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar, .bar.indeterminate { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <!--
        The mark, inlined, because a beta build recolours part of it and draws
        a wink — neither of which can be done to a file the browser has already
        decoded. Same reason src/packages/common/src/components/logo.tsx
        inlines it, and the two want keeping in step by hand.

        Round, matching the favicon and the in-app mark. The square artboard is
        for the app icon.
      -->
      <svg id="owl" width="34" height="34" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g clip-path="url(#c)">
          <rect width="1024" height="1024" fill="#2E2D5F"/>
          <!-- The bird, not the ground. The 2026 mark inverted figure and
               ground, so the beta tint moved here; painting the ground amber
               would only darken a dark square. -->
          <path d="M117.45 677.727C120.743 664.113 120.36 602.152 119.637 587.363C108.168 353.556 283.596 184.2 515.449 191.21C628.229 194.622 718.768 215.015 802.396 299.432C910.784 408.844 908.561 532.939 906.96 674.973C980.416 846.971 995.413 1003.44 928.604 1184.1C909.952 1234.53 867.051 1304.75 824.991 1339.24C790.453 1359.89 755.156 1380.9 714.224 1385.74C709.786 1397.93 708.22 1406.2 698.584 1414.62C671.044 1416.11 672.356 1412.41 650.517 1432.58C636.333 1434.54 635.588 1434.81 621.437 1424.16C619.727 1422.87 618.028 1421.55 616.348 1420.22C586.972 1422.33 583.755 1428.57 567.16 1401.62L461.79 1401.57C430.607 1447.05 435.866 1402.27 392.078 1431.99C375.144 1433.23 354.006 1420.75 337.187 1415.75C321.629 1411.12 319.352 1403.15 312.868 1388.28C259.874 1377.86 241.992 1355.86 203.048 1339.89C155.686 1305.18 114.107 1232 94.36 1178.04C30.9054 1004.63 43.665 843.414 117.45 677.727Z" fill="var(--owl-body)"/>
          <path d="M644.863 353C728.718 353 797.231 400.641 801.761 483.172H802C802 484.836 801.984 486.498 801.956 488.16C801.985 489.397 802 490.638 802 491.882C802 500.32 801.331 508.603 800.045 516.68C796.951 543.102 790.208 569.026 779.963 593.702C765.414 628.744 744.09 660.584 717.207 687.404C690.325 714.224 658.411 735.499 623.287 750.014C588.163 764.529 550.518 772 512.5 772C474.482 772 436.837 764.529 401.713 750.014C366.589 735.499 334.675 714.224 307.793 687.404C280.91 660.584 259.586 628.744 245.037 593.702C234.792 569.026 228.048 543.103 224.955 516.681C223.668 508.604 223 500.321 223 491.882C223 490.638 223.015 489.397 223.044 488.16C223.015 486.498 223 484.836 223 483.172H223.239C227.769 400.641 296.282 353 380.137 353C435.721 353 509.197 384.119 512.5 384.119C515.803 384.119 589.279 353 644.863 353Z" fill="var(--owl-face)"/>
          <path d="M637.617 445.204C665.591 435.093 696.445 449.712 706.342 477.765C716.239 505.817 701.39 536.563 673.265 546.251C645.44 555.834 615.095 541.175 605.303 513.42C595.511 485.664 609.94 455.207 637.617 445.204Z" fill="#2E2D5F"/>
          <!-- Left eye. On a beta build the script swaps it for a closed one.
               It is painted the ground's colour, so the wink has to replace it
               rather than be drawn over it — a stroke laid on top would be one
               dark shape on another and read as nothing. -->
          <path id="eye-left" d="M351.43 445.189C379.259 435.201 409.911 449.686 419.866 477.529C429.817 505.372 415.293 536.009 387.442 545.929C359.639 555.83 329.07 541.337 319.137 513.545C309.2 485.75 323.652 455.159 351.43 445.189Z" fill="#2E2D5F"/>
          <path d="M512.359 573.191C508.812 573.17 516.378 573.212 512.359 573.191C572.603 573.544 536.569 640.612 516.085 676.829C514.504 679.626 510.416 679.514 508.945 676.658C490.115 640.101 452.322 573.191 512.359 573.191Z" fill="#2E2D5F"/>
          <path d="M906.96 674.972C980.417 846.97 995.414 1003.44 928.605 1184.1C909.953 1234.53 867.051 1304.74 824.992 1339.24C737.388 1214.12 737.93 956.855 814.166 829.785C845.783 777.085 880.299 731.645 906.96 674.972Z" fill="var(--owl-wing)"/>
          <path d="M117.45 677.728C148.478 736.742 188.64 787.208 219.025 842.528C286.593 965.554 281.984 1131.04 239.787 1261.69C231.441 1286.49 220.568 1319.3 203.048 1339.89C155.686 1305.18 114.107 1232 94.36 1178.04C30.9054 1004.63 43.665 843.414 117.45 677.728Z" fill="var(--owl-wing)"/>
        </g>
        <defs><clipPath id="c"><rect width="1024" height="1024" rx="512" fill="white"/></clipPath></defs>
      </svg>
      <span class="brand">Gryt<span class="beta-tag">beta</span></span>
    </div>

    <div class="mid">
      <div class="head" id="head">Checking for updates</div>
      <div class="sub" id="sub">&nbsp;</div>
      <div class="foot" id="foot">&nbsp;</div>
    </div>
  </div>

  <div class="track"><div class="bar indeterminate" id="bar"></div></div>

  <script>
    const $ = (id) => document.getElementById(id);

    function setBar(percent) {
      const bar = $("bar");
      if (percent === null) {
        bar.style.width = "";
        bar.classList.add("indeterminate");
      } else {
        bar.classList.remove("indeterminate");
        bar.style.width = percent + "%";
      }
    }

    function setText(head, sub, foot, isError) {
      $("head").classList.remove("versions", "long");
      $("head").textContent = head;
      $("head").classList.toggle("error", !!isError);
      $("sub").innerHTML = sub || "&nbsp;";
      $("foot").innerHTML = foot || "&nbsp;";
    }

    function formatMb(bytes) {
      if (!bytes) return null;
      return Math.round(bytes / (1024 * 1024)) + " MB";
    }

    // The version this build is, filled in once getAppVersion resolves. Until
    // then there is only one half of the pair and the sentence form is used.
    let currentVersion = null;
    let lastStatus = null;

    // A pair needs two versions that differ. `not-available` reports the
    // version you are already running rather than one you are moving to, so
    // without this it would draw an arrow from a version to itself.
    function canPair(target) {
      return !!currentVersion && !!target && currentVersion !== target;
    }

    function setVersionPair(target) {
      const head = $("head");
      head.textContent = "";
      head.classList.remove("error");
      head.classList.add("versions");
      head.classList.toggle("long", (currentVersion + target).length > 18);

      const from = document.createElement("span");
      from.className = "from";
      from.textContent = currentVersion;

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "→";

      const to = document.createElement("span");
      to.className = "to";
      to.textContent = target;

      head.append(from, arrow, to);
    }

    /**
     * The states that are actually an upgrade.
     *
     * `headline` is what used to be the head line — it moves down to the sub
     * line so the pair can have the size, and comes back to the head line
     * whenever there is no pair to draw.
     */
    function setUpdate(target, headline, detail, foot) {
      if (!canPair(target)) {
        const sub = "Version " + target + (detail ? " · " + detail : "");
        setText(headline, sub, foot);
        return;
      }

      setVersionPair(target);
      $("sub").innerHTML = detail ? headline + " · " + detail : headline;
      $("foot").innerHTML = foot || "&nbsp;";
    }

    function render(data) {
      switch (data.status) {
          case "checking":
            setBar(null);
            setText("Checking for updates");
            break;

          case "available":
            setBar(null);
            setUpdate(data.version, "Update available");
            break;

          case "downloading": {
            const pct = data.percent || 0;
            const total = formatMb(data.total);
            setBar(pct);
            setUpdate(
              data.version,
              "Downloading update",
              pct + "%" + (total ? " of " + total : ""),
              "Gryt will restart when this finishes."
            );
            break;
          }

          case "downloaded":
            setBar(100);
            setUpdate(data.version, "Installing update", null, "Restarting…");
            break;

          // quitAndInstall did not quit immediately, which on macOS means
          // Squirrel is still fetching the update through electron-updater's
          // local proxy. The quit comes when that finishes — electron-updater
          // has already registered the listener that performs it — so the
          // honest thing is to keep waiting here rather than open the app on
          // the old version and ask the user to quit it themselves.
          case "installing":
            setBar(100);
            setUpdate(
              data.version,
              "Installing update",
              null,
              "Almost there — Gryt will restart on its own."
            );
            break;

          // The backstop, and it should be rare: the install never completed
          // and we are not holding someone on a splash screen indefinitely for
          // it. The update is downloaded and applies on quit either way.
          case "deferred":
            setBar(100);
            setUpdate(
              data.version,
              "Update ready",
              null,
              "It will finish installing when you quit Gryt."
            );
            break;

          case "not-available":
            setBar(100);
            setText("Gryt is up to date", "Version " + data.version);
            break;

          case "error":
            setBar(100);
            setText("Could not check for updates", data.message || "", "Starting anyway…", true);
            break;
      }
    }

    if (window.splashAPI) {
      window.splashAPI.onUpdateStatus((data) => {
        lastStatus = data;
        render(data);
      });

      window.splashAPI.getAppVersion().then((v) => {
        currentVersion = v;

        // The running build decides this, not the channel preference — someone
        // can be on the beta channel while still running the stable build they
        // last installed, and the mark should describe what is actually open.
        if (/-beta/i.test(v)) {
          document.body.classList.add("beta");
          $("eye-left").setAttribute(
            "d",
            "M322 484 Q369.5 536 417 484"
          );
          $("eye-left").setAttribute("stroke", "#2E2D5F");
          $("eye-left").setAttribute("stroke-width", "22");
          $("eye-left").setAttribute("stroke-linecap", "round");
          $("eye-left").setAttribute("fill", "none");
        }

        // A check can finish before this promise does, and that first status
        // would have been drawn with only half of the pair known.
        if (lastStatus) render(lastStatus);
      });
    }
  </script>
</body>
</html>
